backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME   # <-- change this after you create the repo
  branch: main

# Files are committed straight to GitHub and Netlify auto-deploys on every save.
media_folder: "images/products"
public_folder: "images/products"

collections:
  - name: "products"
    label: "Products"
    file: "products.json"
    format: json
    extension: json
    delete: false
    identifier_field: name
    fields:
      - { label: "Products", name: "products", widget: "list", collapsed: false, summary: "{{fields.name}} — ₹{{fields.price}}"
          fields:
            - { label: "ID", name: "id", widget: "number", value_type: "int" }
            - { label: "Name", name: "name", widget: "string" }
            - { label: "Price (₹)", name: "price", widget: "number", value_type: "int" }
            - { label: "Category", name: "category", widget: "select", options: ["living-room", "bedroom", "dining-room", "office", "storage"] }
            - { label: "Material", name: "material", widget: "select", options: ["wood", "upholstery", "metal"] }
            - { label: "Image", name: "image", widget: "image" }
            - { label: "Description", name: "description", widget: "text", required: false }
      }
