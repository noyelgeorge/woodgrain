<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Product Manager — Wood &amp; Grains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#211d1a;--sub:#6b6259;--line:#e7e0d6;--bg:#faf7f2;--card:#fff;--accent:#8a5a3c;--accent-d:#6e4630;--danger:#b5423a}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:28px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:24px;margin:0}
  header a{color:var(--sub);text-decoration:none;font-size:14px}
  main{max-width:1000px;margin:0 auto;padding:28px 24px 80px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:28px}
  .panel h2{margin:0 0 18px;font-size:16px;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--sub)}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff}
  textarea{resize:vertical;min-height:70px}
  .full{grid-column:1/-1}
  .row{display:flex;gap:10px;align-items:center}
  button{cursor:pointer;border:none;border-radius:8px;font-family:inherit;font-weight:600;font-size:14px}
  .btn-primary{background:var(--accent);color:#fff;padding:11px 22px}
  .btn-primary:hover{background:var(--accent-d)}
  .btn-outline{background:none;border:1px solid var(--line);color:var(--ink);padding:9px 16px}
  .btn-danger{background:none;color:var(--danger);padding:6px 10px;font-size:13px}
  .btn-danger:hover{text-decoration:underline}
  .products-list{display:grid;gap:12px}
  .product-row{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px}
  .product-row img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#eee}
  .product-row .name{font-weight:600;font-size:14px}
  .product-row .meta{font-size:12px;color:var(--sub);margin-top:2px}
  .status{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:none}
  .status.ok{display:block;background:#eaf4ea;color:#2f6d33}
  .status.err{display:block;background:#fbeae8;color:var(--danger)}
  #login-screen{max-width:360px;margin:120px auto;text-align:center}
  #login-screen input{margin:16px 0}
  #app{display:none}
  .empty{color:var(--sub);font-size:14px;padding:20px;text-align:center}
</style>
</head>
<body>

  <div id="login-screen">
    <h1 style="font-family:'DM Serif Display',serif;font-weight:400">Product Manager</h1>
    <p style="color:var(--sub);font-size:14px">Enter the admin password to continue.</p>
    <input type="password" id="pw-input" placeholder="Password">
    <button class="btn-primary" onclick="tryLogin()" style="width:100%">Enter</button>
    <p id="pw-error" style="color:var(--danger);font-size:13px;display:none">Incorrect password.</p>
  </div>

  <div id="app">
    <header>
      <h1>Product Manager — Wood &amp; Grains</h1>
      <a href="index.html">&larr; Back to site</a>
    </header>
    <main>
      <div id="status" class="status"></div>

      <section class="panel">
        <h2 id="form-title">Add a product</h2>
        <input type="hidden" id="edit-id">
        <div class="grid">
          <div>
            <label>Name</label>
            <input type="text" id="f-name" placeholder="e.g. Coffee Table">
          </div>
          <div>
            <label>Price (₹)</label>
            <input type="number" id="f-price" placeholder="8999">
          </div>
          <div>
            <label>Category</label>
            <select id="f-category">
              <option value="living-room">Living Room</option>
              <option value="bedroom">Bedroom</option>
              <option value="dining-room">Dining Room</option>
              <option value="office">Office</option>
              <option value="storage">Storage</option>
            </select>
          </div>
          <div>
            <label>Material</label>
            <select id="f-material">
              <option value="wood">Wood</option>
              <option value="upholstery">Upholstery</option>
              <option value="metal">Metal</option>
            </select>
          </div>
          <div class="full">
            <label>Description (optional)</label>
            <textarea id="f-description" placeholder="A short line about this piece"></textarea>
          </div>
          <div class="full">
            <label>Photo</label>
            <input type="file" id="f-image" accept="image/*">
            <div id="current-image" style="margin-top:8px;font-size:12px;color:var(--sub)"></div>
          </div>
        </div>
        <div class="row" style="margin-top:18px">
          <button class="btn-primary" onclick="saveProduct()" id="save-btn">Save product</button>
          <button class="btn-outline" onclick="resetForm()" id="cancel-btn" style="display:none">Cancel edit</button>
        </div>
      </section>

      <section class="panel">
        <h2>Your products</h2>
        <div class="products-list" id="products-list">
          <div class="empty">Loading…</div>
        </div>
      </section>
    </main>
  </div>

<script src="js/supabase-config.js"></script>
<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let editingId = null;

  function tryLogin() {
    const val = document.getElementById('pw-input').value;
    if (val === ADMIN_PASSWORD) {
      sessionStorage.setItem('wg_admin_ok', '1');
      showApp();
    } else {
      document.getElementById('pw-error').style.display = 'block';
    }
  }
  document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadList();
  }
  if (sessionStorage.getItem('wg_admin_ok') === '1') showApp();

  function showStatus(msg, ok = true) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (ok ? 'ok' : 'err');
    setTimeout(() => { el.className = 'status'; }, 4000);
  }

  async function loadList() {
    const list = document.getElementById('products-list');
    const { data, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
    if (error) { list.innerHTML = `<div class="empty">Couldn't load products: ${error.message}</div>`; return; }
    if (!data.length) { list.innerHTML = '<div class="empty">No products yet — add your first one above.</div>'; return; }
    list.innerHTML = data.map(p => `
      <div class="product-row">
        <img src="${p.image_url || ''}" alt="${p.name}" onerror="this.style.opacity=0">
        <div>
          <div class="name">${p.name}</div>
          <div class="meta">₹${Number(p.price).toLocaleString('en-IN')} · ${p.category} · ${p.material}</div>
        </div>
        <div class="row">
          <button class="btn-outline" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn-danger" onclick="deleteProduct('${p.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function editProduct(p) {
    editingId = p.id;
    document.getElementById('form-title').textContent = 'Edit product';
    document.getElementById('f-name').value = p.name || '';
    document.getElementById('f-price').value = p.price || '';
    document.getElementById('f-category').value = p.category || 'living-room';
    document.getElementById('f-material').value = p.material || 'wood';
    document.getElementById('f-description').value = p.description || '';
    document.getElementById('current-image').textContent = p.image_url ? 'Current photo is set — choose a new file only if you want to replace it.' : '';
    document.getElementById('cancel-btn').style.display = 'inline-block';
    document.getElementById('save-btn').textContent = 'Save changes';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    editingId = null;
    document.getElementById('form-title').textContent = 'Add a product';
    document.getElementById('f-name').value = '';
    document.getElementById('f-price').value = '';
    document.getElementById('f-category').value = 'living-room';
    document.getElementById('f-material').value = 'wood';
    document.getElementById('f-description').value = '';
    document.getElementById('f-image').value = '';
    document.getElementById('current-image').textContent = '';
    document.getElementById('cancel-btn').style.display = 'none';
    document.getElementById('save-btn').textContent = 'Save product';
  }

  async function uploadImage(file) {
    const ext = file.name.split('.').pop();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await sb.storage.from('product-images').upload(path, file);
    if (error) throw error;
    const { data } = sb.storage.from('product-images').getPublicUrl(path);
    return data.publicUrl;
  }

  async function saveProduct() {
    const name = document.getElementById('f-name').value.trim();
    const price = Number(document.getElementById('f-price').value);
    const category = document.getElementById('f-category').value;
    const material = document.getElementById('f-material').value;
    const description = document.getElementById('f-description').value.trim();
    const file = document.getElementById('f-image').files[0];

    if (!name || !price) { showStatus('Please fill in at least a name and price.', false); return; }

    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';

    try {
      let image_url;
      if (file) image_url = await uploadImage(file);

      if (editingId) {
        const update = { name, price, category, material, description };
        if (image_url) update.image_url = image_url;
        const { error } = await sb.from('products').update(update).eq('id', editingId);
        if (error) throw error;
        showStatus('Product updated.');
      } else {
        if (!image_url) { showStatus('Please choose a photo for a new product.', false); btn.disabled = false; btn.textContent = 'Save product'; return; }
        const { error } = await sb.from('products').insert({ name, price, category, material, description, image_url });
        if (error) throw error;
        showStatus('Product added.');
      }
      resetForm();
      loadList();
    } catch (e) {
      showStatus('Something went wrong: ' + e.message, false);
    } finally {
      btn.disabled = false; btn.textContent = editingId ? 'Save changes' : 'Save product';
    }
  }

  async function deleteProduct(id) {
    if (!confirm('Delete this product? This cannot be undone.')) return;
    const { error } = await sb.from('products').delete().eq('id', id);
    if (error) { showStatus('Could not delete: ' + error.message, false); return; }
    showStatus('Product deleted.');
    loadList();
  }
</script>
</body>
</html>
